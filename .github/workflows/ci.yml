name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    name: Resolve pipeline source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Pin every stage to one commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Independent validation groups start together, as in reflow.
  test-stage:
    name: Test
    needs: source
    uses: ./.github/workflows/stage-test.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  build-stage:
    name: Build
    needs: source
    uses: ./.github/workflows/stage-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}

  verified:
    name: CI verification
    if: always()
    needs: [source, test-stage, build-stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          failures = {
              name: result['result']
              for name, result in json.loads(os.environ['RESULTS_JSON']).items()
              if result['result'] != 'success'
          }
          if failures:
              raise SystemExit(f'Pipeline checks did not pass: {failures}')
          print('Every required stage check passed.')
          PYTHON
