name: Build stage

# Called by ci.yml so all checks stay inside one pipeline run.
on:
  workflow_call:
    inputs:
      sha:
        description: Immutable source commit resolved by the entry workflow
        type: string
        required: true

permissions:
  contents: read

jobs:
  container:
    name: Development container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build development container
        uses: docker/build-push-action@v7
        with:
          context: .
          target: develop
          load: true
          push: false
          tags: premiscale:ci
          cache-from: type=gha,scope=development
          cache-to: type=gha,mode=max,scope=development
      - name: Check CLI and run unit tests in the container
        run: |
          docker run --rm premiscale:ci poetry run premiscale --version
          docker run --rm premiscale:ci poetry run pytest -q

  chart:
    name: Helm charts (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.0
      - name: Build locked chart dependencies and lint charts
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler --force-update
          helm repo add cnpg https://cloudnative-pg.github.io/charts --force-update
          helm repo add kedacore https://kedacore.github.io/charts --force-update
          helm repo add strimzi https://strimzi.io/charts/ --force-update
          for chart in charts/*/Chart.yaml; do
            chart_dir="${chart%/Chart.yaml}"
            helm dependency build "$chart_dir"
            helm lint "$chart_dir"
          done
      - name: Render and lint the local Minikube addon
        run: |
          ./integrations/minikube/minikube.sh render > "$RUNNER_TEMP/premiscale-minikube.yaml"
          helm lint integrations/minikube/chart --kube-version 1.35.0
      - name: Validate charts with hypothesis-helm
        uses: astrivant/hypothesis-helm@main
        with:
          chart: charts/
          python-version: '3.14'
          helm-version: v4.3.0
          schema-version: '1.35.0'
          shard: ${{ matrix.shard }}/3
          jobs: '2'
          artifact-name: hypothesis-helm-premiscale
          artifact-dir: reports/hypothesis-helm

  docs-build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Generate API documentation
        run: >-
          poetry run pdoc --docformat google
          --output-dir "$RUNNER_TEMP/premiscale-docs"
          premiscale premiscale_cluster_autoscaler

  build-complete:
    name: Require complete build stage
    if: always()
    needs: [container, chart, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          failures = {
              name: result['result']
              for name, result in json.loads(os.environ['RESULTS_JSON']).items()
              if result['result'] != 'success'
          }
          if failures:
              raise SystemExit(f'Pipeline checks did not pass: {failures}')
          print('Every required stage check passed.')
          PYTHON
