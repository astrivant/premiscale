name: Set up Python
description: Install Python 3.14 and the locked development dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: poetry.lock
    - name: Install native dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvirt-dev pkg-config
    - name: Install Poetry
      shell: bash
      run: python -m pip install poetry==2.5.1
    - name: Install project dependencies
      shell: bash
      run: poetry install --with dev --without profile --no-interaction
