default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts|integrations)/.*\.py$
        exclude: _pb2(_grpc)?\.py$

  - repo: https://github.com/jsh9/pydoclint
    rev: 0.9.1
    hooks:
      - id: pydoclint
        args: [--config=pyproject.toml]
        files: ^(pkg|scripts|integrations)/.*\.py$
        exclude: _pb2(_grpc)?\.py$

  - repo: https://github.com/bitnami/readme-generator-for-helm
    rev: 4d29f59abac6aeed6fbc2467e24fc17560057bcb # 3.0.1
    hooks:
      - id: helm-readme-generator
        name: PremiScale chart README
        alias: premiscale-readme
        language_version: 24.14.0
        args: [--readme=charts/premiscale/README.md, --values=charts/premiscale/values.yaml]
        files: ^(charts/premiscale/(README\.md|values\.yaml)|\.pre-commit-config\.yaml)$
        always_run: false
        pass_filenames: false
      - id: helm-readme-generator
        name: PremiScale CRDs chart README
        alias: premiscale-crds-readme
        language_version: 24.14.0
        args: [--readme=charts/premiscale-crds/README.md, --values=charts/premiscale-crds/values.yaml]
        files: ^(charts/premiscale-crds/(README\.md|values\.yaml)|\.pre-commit-config\.yaml)$
        always_run: false
        pass_filenames: false

  - repo: local
    hooks:
      - id: poetry-check
        name: Poetry metadata and lock
        entry: poetry check --lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|poetry\.lock|\.pre-commit-config\.yaml)$

      - id: schema-artifacts
        name: Generated configuration schemas
        entry: bash scripts/validation/python.sh scripts/schemas/generate-config-schemas.py --check
        language: system
        pass_filenames: false
        files: ^(charts/premiscale-crds/(crds/|schemas/|values\.schema\.json$)|charts/premiscale/values\.schema\.json$|pkg/premiscale/config/schemas/|scripts/schemas/|\.pre-commit-config\.yaml$)

      - id: controller-config
        name: Controller configuration examples
        entry: bash scripts/validation/python.sh scripts/validation/check-config.py
        language: system
        pass_filenames: false
        files: ^(pkg/premiscale/(config/|schemas/)|pkg/tests/data/config/|\.config/(minikube|keda)/controller\.yaml$|charts/premiscale-crds/crds/|scripts/validation/check-config\.py$|\.pre-commit-config\.yaml$)

      - id: docstring-layout
        name: Required multiline docstrings
        entry: bash scripts/validation/python.sh scripts/validation/check-docstrings.py
        language: system
        types: [python]
        files: ^(pkg|scripts|integrations)/.*\.py$
        exclude: _pb2(_grpc)?\.py$

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck --external-sources
        language: system
        types: [shell]

      - id: shfmt
        name: Shell formatting
        entry: shfmt -d -i 4 -ci -sr
        language: system
        types: [shell]

      - id: pylint
        name: Pylint
        entry: bash scripts/validation/python.sh -m pylint --rcfile=pyproject.toml pkg
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(pkg/.*\.py|pyproject\.toml|poetry\.lock|\.pre-commit-config\.yaml)$
        exclude: _pb2(_grpc)?\.py$

      - id: mypy
        name: mypy
        entry: bash scripts/validation/python.sh -m mypy --config-file pyproject.toml pkg
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(pkg/.*\.py|pyproject\.toml|poetry\.lock|\.pre-commit-config\.yaml)$

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
