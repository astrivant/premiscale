apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autoscalinggroups.premiscale.com
spec:
  group: premiscale.com
  scope: Namespaced
  names:
    kind: AutoscalingGroup
    plural: autoscalinggroups
    singular: autoscalinggroup
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Minimum
      type: integer
      jsonPath: .spec.scaling.minNodes
    - name: Maximum
      type: integer
      jsonPath: .spec.scaling.maxNodes
    - name: Target
      type: integer
      jsonPath: .status.targetReplicas
    - name: Running
      type: integer
      jsonPath: .status.runningReplicas
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              image:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
                description: Existing libvirt template domain name; independent of this resource metadata.name.
              imageMigration:
                type: string
                enum:
                - migrate
                - centralized
              cloud-init:
                type: object
                properties:
                  inline:
                    type: string
                  file:
                    type: string
              hosts:
                type: array
                items:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                x-kubernetes-list-type: set
                minItems: 1
                description: Names of Host resources in the same namespace.
              nodeLabels:
                type: object
                additionalProperties:
                  type: string
              nodeTaints:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      minLength: 1
                    value:
                      type: string
                    effect:
                      type: string
                      enum:
                      - NoSchedule
                      - PreferNoSchedule
                      - NoExecute
                  required:
                  - key
                  - effect
              maxPods:
                type: integer
                minimum: 1
              replacement:
                type: object
                properties:
                  strategy:
                    type: string
                    enum:
                    - rollingUpdate
                  maxUnavailable:
                    type: integer
                    minimum: 0
                  maxSurge:
                    type: integer
                    minimum: 0
                required:
                - strategy
                - maxUnavailable
                - maxSurge
              networking:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - static
                    - dynamic
                    - ignore
                  addresses:
                    type: array
                    items:
                      type: string
                      minLength: 1
                    minItems: 1
                  subnet:
                    type: string
                    minLength: 1
                  gateway:
                    type: string
                    minLength: 1
                required:
                - type
                - addresses
                - subnet
                - gateway
              scaling:
                type: object
                properties:
                  method:
                    type: string
                    enum:
                    - random
                    - vacancy
                    - linear
                    - linear-random
                  maxNodes:
                    type: integer
                    minimum: 0
                  minNodes:
                    type: integer
                    minimum: 0
                  increment:
                    type: integer
                    minimum: 0
                  cooldown:
                    type: integer
                    minimum: 0
                  resourceTarget:
                    type: object
                    properties:
                      cpu:
                        type: integer
                        minimum: 0
                      memory:
                        type: integer
                        minimum: 0
                      storage:
                        type: integer
                        minimum: 0
                    required:
                    - cpu
                    - memory
                    - storage
                required:
                - method
                - maxNodes
                - minNodes
                - increment
                - cooldown
                - resourceTarget
                x-kubernetes-validations:
                - rule: self.minNodes <= self.maxNodes
                  message: minNodes must not exceed maxNodes
            required:
            - image
            - name
            - imageMigration
            - cloud-init
            - hosts
            - replacement
            - networking
            - scaling
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
                minimum: 0
              lastObservationTime:
                type: string
                format: date-time
              targetReplicas:
                type: integer
                minimum: 0
              runningReplicas:
                type: integer
                minimum: 0
                description: VMs with successful provider operations; this does not assert Kubernetes Node readiness.
              pendingReplicas:
                type: integer
                minimum: 0
              deletingReplicas:
                type: integer
                minimum: 0
              failedReplicas:
                type: integer
                minimum: 0
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - type
                items:
                  type: object
                  required:
                  - type
                  - status
                  - reason
                  - message
                  - lastTransitionTime
                  - observedGeneration
                  properties:
                    type:
                      type: string
                      minLength: 1
                    status:
                      type: string
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                    reason:
                      type: string
                      minLength: 1
                    message:
                      type: string
                    observedGeneration:
                      type: integer
                      format: int64
                      minimum: 0
                    lastTransitionTime:
                      type: string
                      format: date-time
        required:
        - spec
    subresources:
      status: {}
