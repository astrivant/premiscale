apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hosts.premiscale.com
spec:
  group: premiscale.com
  scope: Namespaced
  names:
    kind: Host
    plural: hosts
    singular: host
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Address
      type: string
      jsonPath: .spec.address
    - name: Hypervisor
      type: string
      jsonPath: .spec.hypervisor
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              address:
                type: string
                minLength: 1
                description: Hypervisor address or DNS name.
              port:
                type: integer
                minimum: 1
                maximum: 65535
              protocol:
                type: string
                enum:
                - ssh
                - SSH
                - tls
                - TLS
                - http
                - HTTP
                - https
                - HTTPS
              timeout:
                type: integer
                minimum: 1
                maximum: 599940
                default: 45
              user:
                type: string
                minLength: 1
              sshKey:
                type: string
                minLength: 1
                description: Private SSH key or an environment-variable reference expanded by the controller.
              hypervisor:
                type: string
                enum:
                - esx
                - qemu
              resources:
                type: object
                properties:
                  cpu:
                    type: integer
                    minimum: 0
                  memory:
                    type: integer
                    minimum: 0
                  storage:
                    type: integer
                    minimum: 0
                required:
                - cpu
                - memory
                - storage
            required:
            - address
            - port
            - protocol
            - hypervisor
        required:
        - spec
