apiVersion: v2
name: premiscale
description: The PremiScale autoscaling controller
type: application
version: 0.0.1
appVersion: "0.0.1"
kubeVersion: ">=1.29.0-0"

dependencies:
  - name: strimzi-kafka-operator
    repository: https://strimzi.io/charts/
    version: 1.2.0
    condition: strimzi-kafka-operator.enabled
  - name: keda
    repository: https://kedacore.github.io/charts
    version: 2.20.2
    condition: keda.enabled
  - name: dragonfly
    repository: oci://ghcr.io/dragonflydb/dragonfly/helm
    version: v1.40.0
    condition: dragonfly.enabled
  - name: premiscale-crds
    repository: file://../premiscale-crds
    version: 0.0.1
  - name: cluster-autoscaler
    repository: https://kubernetes.github.io/autoscaler
    version: 9.59.0
    condition: cluster-autoscaler.enabled
  - name: cloudnative-pg
    repository: https://cloudnative-pg.github.io/charts
    version: 0.29.0
    condition: cloudnative-pg.enabled
