apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: premiscale-data
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.providerStorage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.providerStorage.size }}
